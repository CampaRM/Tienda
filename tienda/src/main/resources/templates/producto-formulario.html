<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${producto.idProducto != null} ? 'Editar Producto' : 'Nuevo Producto'"></title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>
<body>
    <div class="container">
        <h1 th:text="${producto.idProducto != null} ? 'Editar Producto' : 'Nuevo Producto'"></h1>

        <form th:action="${producto.idProducto != null} ? @{/producto/actualizar} : @{/producto/guardar}" 
              th:object="${producto}" 
              method="post">

            <input type="hidden" th:field="*{idProducto}">

            <div class="campo">
                <label>Nombre del Producto</label>
                <input type="text" th:field="*{nombreProducto}">
                <div class="error" th:if="${#fields.hasErrors('nombreProducto')}" th:errors="*{nombreProducto}"></div>
            </div>

            <div class="campo">
                <label>Precio</label>
                <input type="number" step="0.01" th:field="*{precioProducto}">
                <div class="error" th:if="${#fields.hasErrors('precioProducto')}" th:errors="*{precioProducto}"></div>
            </div>

            <div class="campo">
                <label>Stock</label>
                <input type="number" th:field="*{stock}">
                <div class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
            </div>

            <div class="campo">
                <label>Categoría</label>
                <select th:field="*{categoria}">
                    <option th:each="c : ${categorias}" 
                            th:value="${c.idCategoria}" 
                            th:text="${c.nombreCategoria}"></option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
            </div>

            <div class="acciones">
                <button type="submit" class="btn btn-guardar" 
                        th:text="${producto.idProducto != null} ? 'Actualizar' : 'Guardar'"></button>
                <a th:href="@{/producto}" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
