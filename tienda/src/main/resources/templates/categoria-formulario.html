<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${categoria.idCategoria != null} ? 'Editar Categoría' : 'Nueva Categoría'"></title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

    <div class="auth-container">
        <div class="auth-header">
            <h2 th:text="${categoria.idCategoria != null} ? 'Editar-Categoría' : 'Nueva-Categoría'"></h2>
            <p th:text="${categoria.idCategoria != null} ? 'Modifica los datos de la categoría' : 'Registra una nueva categoría para la tiendita'"></p>
        </div>

        <form th:action="${categoria.idCategoria != null} ? @{/categoria/actualizar} : @{/categoria/guardar}" 
              th:object="${categoria}" method="post">

            <input type="hidden" th:field="*{idCategoria}">

            <div class="form-group">
                <label for="nombreCategoria">Nombre de la Categoría</label>
                <input type="text" id="nombreCategoria" th:field="*{nombreCategoria}" 
                       placeholder="Ej. Bebidas, Snacks..." required>
                <div class="error-msg" th:if="${#fields.hasErrors('nombreCategoria')}" 
                     th:errors="*{nombreCategoria}" style="color: #ff4d4d; font-size: 0.8rem;"></div>
            </div>

            <div class="form-group">
                <label for="descripcionCategoria">Descripción</label>
                <input type="text" id="descripcionCategoria" th:field="*{descripcionCategoria}" 
                       placeholder="Breve descripción de los productos" required>
            </div>

            <button type="submit" class="btn-auth" 
                    th:text="${categoria.idCategoria != null} ? 'Actualizar Categoría' : 'Guardar Categoría'"></button>

            <div class="auth-footer">
                <p><a th:href="@{/categoria}">Volver a la lista</a></p>
            </div>

        </form>
    </div>

</body>

</html>
