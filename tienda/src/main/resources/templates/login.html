<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Tiendita Guajitos</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h2>Tiendita<span>-Login</span></h2>
            <p>Acceso al sistema</p>
        </div>

        <div th:if="${param.error}" class="error-msg" style="text-align: center; margin-bottom: 15px; background: rgba(255, 77, 77, 0.1); padding: 10px; border-radius: 4px;">
            Usuario o contraseña incorrectos
        </div>

        <div th:if="${param.logout}" style="color: #48bb78; text-align: center; margin-bottom: 15px; font-size: 0.85rem;">
            Has cerrado sesión correctamente
        </div>

        <form th:action="@{/login}" method="post">
            
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-auth">Ingresar</button>

            <div class="auth-footer">
                <p>¿No tienes cuenta? <a th:href="@{/register}">Regístrate aquí</a></p>
            </div>
            
        </form>
    </div>

</body>
</html>
