<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Gestión</title>
    <link rel="stylesheet" th:href="@{/css/general.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="header-container">
        <h1 class="titulo">LISTA DE PRODUCTOS</h1>
    </div>

    <div class="crud-actions">
        <a th:href="@{/producto/nuevo}" class="btn btn-nuevo">Nuevo productto</a>
        <a th:href="@{/home}" class="btn btn-nuevo">Ir Home</a>
    </div>

    <div class="crud-actions-secondary">
        <small class="texto-auxiliar">Ver otras tablas:</small>
        <div class="botones-container">
            <a th:href="@{/pedido}" class="btn-sm">Ir a pedidos</a>
            <a th:href="@{/usuario}" class="btn-sm">Ir a usuarios</a>
            <a th:href="@{/detalle-pedido}" class="btn-sm">Ir a Detalle Pedido</a>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>NOMBRE</th>
                <th>PRECIO</th>
                <th>STOCK</th>
                <th>CATEGORÍA</th>
                <th style="text-align: center;">ACCIONES</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${productos}">
                <td th:text="${p.idProducto}"></td>
                <td th:text="${p.nombreProducto}"></td>
                <td th:text="${p.precioProducto}"></td>
                <td th:text="${p.stock}"></td>
                <td th:text="${p.categoria.nombreCategoria}"></td>
                <td style="text-align: center;">
                    <a th:href="@{/producto/editar/{id}(id=${p.idProducto})}" 
                       class="btn-icon" title="Editar Producto">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </a>

                    <a th:href="@{/producto/eliminar/{id}(id=${p.idProducto})}" 
                       class="btn-icon danger" 
                       title="Eliminar Producto"
                       onclick="return confirm('¿Deseas eliminar este producto?')">
                        <i class="fa-solid fa-trash"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(productos)}" class="mensaje-vacio">
        No hay productos registrados en la base de datos.
    </div>

</body>
</html>
